<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NannyCam - Camera</title>
    <style>
      * { box-sizing: border-box; margin: 0; }
      body { font-family: system-ui, sans-serif; background: #111; color: #eee; }
      main { display: flex; flex-direction: column; align-items: center; gap: 1rem; padding: 1rem; min-height: 100vh; }
      main.center { justify-content: center; }
      .preview { width: 100%; max-width: 480px; border-radius: 8px; background: #000; }
      .code { font-family: ui-monospace, monospace; font-size: 2.5rem; letter-spacing: 0.3em; font-weight: 700; }
      .qr { background: #fff; padding: 8px; border-radius: 8px; }
      .status { color: #aaa; }
      .error { color: #f66; }
      button { font-size: 1.25rem; padding: 0.9rem 2.2rem; border: none; border-radius: 8px; cursor: pointer; }
      button.primary { background: #2b7; color: #fff; }
      button.danger { background: #d33; color: #fff; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./camera/main.tsx"></script>
  </body>
</html>
